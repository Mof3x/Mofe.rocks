  <meta name="robots" content="noindex">
  <!--
    GitHub Pages shows this page for ANY missing URL, however deep, so relative
    links here could break. The script below sets a <base> so every link and
    asset resolves from the site root.
    - Project site (username.github.io/repo-name/): detected automatically.
    - Custom domain or a username.github.io repo: set content="/" below.
  -->
  <meta name="site-base" content="">
  <script>
    (function () {
      var base = document.querySelector('meta[name="site-base"]').content;
      if (!base) {
        var seg = location.pathname.split("/")[1];
        base = /\.github\.io$/i.test(location.hostname) && seg ? "/" + seg + "/" : "/";
      }
      if (location.protocol === "file:") base = "";
      if (base) {
        var b = document.createElement("base");
        b.href = base;
        document.head.appendChild(b);
      }
      document.documentElement.className = "js";
      try { if (localStorage.getItem("siw-theme") === "ivory") document.documentElement.setAttribute("data-theme", "ivory"); } catch (e) {}
    })();
  </script>
